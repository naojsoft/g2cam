[build-system]
requires = ["setuptools>=64",
            "setuptools_scm[toml]>=7",
            "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "g2cam/version.py"
version_scheme = "release-branch-semver"

[tool.ruff]
# scripts/ are Python but carry no .py suffix, so ruff would not glob them
# -- and they are exactly the files that were straddling Python 2 and 3.
# NOTE: target-version is set alongside requires-python, so the two agree.
extend-exclude = ["build"]
extend-include = ["scripts/g2cam",
                  "scripts/get_status",
                  "scripts/mkbulk",
                  "scripts/ro_mgr_svc",
                  "scripts/ro_name_svc",
                  "scripts/ro_ps_svc",
                  "scripts/ro_shell",
                  "scripts/stubgen"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E265", "E266", "E402", "E741", "E501", "F841"]
