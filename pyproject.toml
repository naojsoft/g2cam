[build-system]
requires = ["setuptools>=64",
            "setuptools_scm[toml]>=7",
            "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "g2cam/version.py"
version_scheme = "release-branch-semver"

[tool.ruff]
# scripts/ are Python but carry no .py suffix, so ruff would not glob them
# -- and they are exactly the files that were straddling Python 2 and 3.
# target-version matches python_requires in setup.cfg; keep them together.
target-version = "py311"
extend-exclude = ["build"]
extend-include = ["scripts/g2cam",
                  "scripts/get_status",
                  "scripts/mkbulk",
                  "scripts/ro_mgr_svc",
                  "scripts/ro_name_svc",
                  "scripts/ro_ps_svc",
                  "scripts/ro_shell",
                  "scripts/stubgen"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E265", "E266", "E402", "E741", "E501", "F841"]

[tool.ruff.lint.per-file-ignores]
# radec.py is dense coordinate and precession arithmetic carried over
# from an older language, where the semicolons group the terms of one
# formula onto one line.  Splitting 71 of those would churn numerically
# fiddly code for no gain in what it says.
"g2base/astro/radec.py" = ["E701", "E702"]
# both do `from ro_config import *` to pull in the configuration
# defaults, which is what makes every name that comes from there
# undefined as far as ruff can see
"g2base/remoteObjects/PubSub.py" = ["F403", "F405"]
"g2base/remoteObjects/remoteObjects.py" = ["F403", "F405"]
